name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bash -n install.sh && python -m unittest discover -s tests -v
      - name: Package source-only installer
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=chatgpt-steamdeck/ HEAD > dist/chatgpt-steamdeck.tar.gz
          cp install.sh dist/install.sh
          cd dist
          sha256sum chatgpt-steamdeck.tar.gz install.sh > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag
